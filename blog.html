<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog - Austin EMDR Therapy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Austin EMDR Therapy</a>
      <nav class="site-nav">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="about-emdr.html">About EMDR</a>
        <a href="about.html">About Lindsey</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </header>

  <main class="page-content container">
    <section class="page-heading">
      <div class="heading-text">
        <h1>Blog</h1>
        <p>Reflections, support, and practical insights for healing, growth, and everyday life.</p>
      </div>
    </section>

    <section class="blog-shell">
      <div class="blog-main">
        <section class="blog-list-section">
          <div class="blog-list-header">
            <h2>Latest articles</h2>
            <p>Browse the most recent posts here.</p>
          </div>
          <div id="blog-posts" class="blog-posts"></div>
        </section>
      </div>

      <aside class="blog-sidebar">
        <section class="blog-search-card">
          <h2>Search</h2>
          <label class="visually-hidden" for="blog-search">Search posts</label>
          <input id="blog-search" type="search" placeholder="Search posts" />
        </section>

        <section class="blog-categories-card">
          <h2>Categories</h2>
          <ul class="blog-categories">
            <li><button type="button" class="category-chip is-active" data-category="all">All topics</button></li>
            <li><button type="button" class="category-chip" data-category="Anxiety">Anxiety</button></li>
            <li><button type="button" class="category-chip" data-category="Trauma & Healing">Trauma & Healing</button></li>
            <li><button type="button" class="category-chip" data-category="Couples & Relationships">Couples & Relationships</button></li>
            <li><button type="button" class="category-chip" data-category="Depression">Depression</button></li>
            <li><button type="button" class="category-chip" data-category="Grief & Loss">Grief & Loss</button></li>
            <li><button type="button" class="category-chip" data-category="Life Transitions">Life Transitions</button></li>
            <li><button type="button" class="category-chip" data-category="Neurodiversity">Neurodiversity</button></li>
            <li><button type="button" class="category-chip" data-category="Self Care & Well-Being">Self Care & Well-Being</button></li>
            <li><button type="button" class="category-chip" data-category="General">General</button></li>
          </ul>
        </section>
      </aside>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 Austin EMDR Therapy</p>
      <nav class="footer-nav">
        <a href="index.html">Home</a>
        <a href="blog.html">Blog</a>
        <a href="about-emdr.html">About EMDR</a>
        <a href="about.html">About Lindsey</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="blog.js"></script>
</body>
</html>
